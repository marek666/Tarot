name: Verify Tarot Trainer
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/v0.4.1-journal-navigation]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm audit --omit=dev
